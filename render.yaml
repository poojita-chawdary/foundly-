# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Split deployment: Vercel frontend, Render API, Supabase Postgres and private Storage.
services:
  - type: web
    name: foundly-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./deploy/render/backend.Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase,prod
      - key: SERVER_PORT
        value: "8080"
      - key: COOKIE_SECURE
        value: "true"
      - key: MEMBERSHIP_MODE
        value: MANUAL
      - key: SUPABASE_URL
        value: https://afnbdrltoxyilkvxrgny.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: foundly-images
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65.0 -Djava.awt.headless=true -Duser.timezone=UTC
